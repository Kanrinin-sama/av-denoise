[package]
name = "av-denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# A symlink to the workspace README, so `include_str!("../README.md")` in src/lib.rs
# resolves both in-tree and inside the packaged crate.
readme = "README.md"
description = "Fast, best in class video denoising for all providing NLMeans, NLMeans-HQ and NL4D algorithms."
categories = ["multimedia::video"]
keywords = ["cubecl", "denoise", "gpu"]
exclude = [
    "scripts/",
    ".idea/",
    "cubecl.toml",
    "docker/",
    ".github/",
    "Justfile"
]
autobins = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
av-denoise-core.workspace = true
anyhow.workspace = true
bon.workspace = true
cubecl.workspace = true
cubecl-runtime.workspace = true
cubecl-environment.workspace = true
etcetera = "0.11"
thiserror.workspace = true
tracing.workspace = true
strum.workspace = true
strum_macros.workspace = true

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wgpu = "30"

[features]
vulkan = ["av-denoise-core/vulkan", "cubecl/vulkan"]
metal = ["av-denoise-core/metal", "cubecl/metal"]
cuda = ["av-denoise-core/cuda", "cubecl/cuda"]
rocm = ["av-denoise-core/rocm", "cubecl/hip"]
default = ["vulkan"]

[[bench]]
name = "denoise"
harness = false

[[bench]]
name = "reseed"
harness = false
