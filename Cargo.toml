[workspace]
resolver = "3"
members = ["av-denoise-core", "av-denoise", "av-denoise-service", "av-denoise-vs"]

[workspace.package]
version = "0.5.0-alpha3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ChillFish8/av-denoise"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
bytesize = "2"
crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"
strum = "0.28"
strum_macros = "0.28"
bon = "3"
cubecl = { version = "0.11.0-pre.4", features = ["std", "persistence"] }
cubecl-runtime = "0.11.0-pre.4"
cubecl-environment = "0.11.0-pre.4"
av-denoise-core = { path = "av-denoise-core", version = "0.5.0-alpha3", default-features = false }
av-denoise-service = { path = "av-denoise-service", default-features = false }

[patch.crates-io]
av-decoders = { path = "crates/av-decoders" }

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true
